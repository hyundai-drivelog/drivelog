<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#131417">
<meta name="description" content="차에서 보낸 드라이브 카드를 휴대폰에 간직해요. 사진을 넣고 이미지로 저장할 수 있어요.">
<title>DRIVELOG 드라이브 카드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23131417'/%3E%3Cpath d='M8 31C10 18 21 25 24 16C26 11 28 9.5 32 8.5' stroke='white' stroke-width='3.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='31' r='3.2' fill='white'/%3E%3Ccircle cx='32' cy='8.5' r='5.2' fill='white'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --bg: #131417; --ink: #ffffff; --muted: #b4b6ba; --soft: #1f2023; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
         padding: 24px max(16px, env(safe-area-inset-left)) max(28px, env(safe-area-inset-bottom)); }
  .page { width: min(100%, 540px); margin-inline: auto; }
  .page-header { padding: 0 4px 22px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; letter-spacing: .04em; }
  .brand svg { width: 25px; height: 25px; }
  h1 { margin: 20px 0 8px; font-size: clamp(25px, 6.5vw, 32px); line-height: 1.25; letter-spacing: -.04em; text-wrap: balance; }
  .intro { text-align: left; font-size: 15px; }
  canvas { width: 100%; max-width: 540px; height: auto; border-radius: 16px; display: block; }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
  #guide, #share { grid-column: 1 / -1; }
  #save { grid-column: 1 / -1; }
  .actions:has(#photo:not([hidden])) #save { grid-column: auto; }
  button, a.action { width: 100%; max-width: 540px; min-height: 56px; border: 0; border-radius: 16px; font: inherit; font-size: 18px;
           font-weight: 700; background: var(--ink); color: var(--bg); cursor: pointer; display: flex; align-items: center;
           justify-content: center; text-decoration: none; padding: 14px 16px; line-height: 1.35;
           transition: background-color 160ms ease, color 160ms ease; -webkit-tap-highlight-color: transparent; }
  .secondary { background: var(--soft) !important; color: var(--ink) !important; }
  button:hover, a.action:hover { background: #e0e1e6; }
  .secondary:hover { background: #303136 !important; }
  button:active, a.action:active { background: #c7c9ce; }
  .secondary:active { background: #44464e !important; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  button:disabled { opacity: .5; cursor: wait; }
  [hidden] { display: none !important; }
  p { margin: 0; max-width: 540px; color: var(--muted); font-size: 14px; line-height: 1.5; text-align: center; }
  .status { min-height: 24px; margin: 12px 4px 0; text-align: left; color: var(--ink); }
  .privacy { margin: 14px 4px 0; padding-top: 18px; border-top: 1px solid #34363b; }
  .privacy-title { margin: 0 0 7px; font-size: 14px; font-weight: 600; }
  #note { text-align: left; overflow-wrap: anywhere; }
  .error { padding: 32px 0; font-size: 18px; color: var(--ink); text-align: left; }
  @media (max-width: 350px) { .actions { grid-template-columns: minmax(0, 1fr); } button, a.action { font-size: 16px; } }
  @media (prefers-reduced-motion: reduce) { button, a.action { transition: none; } }
</style>
</head>
<body>
<main class="page">
<header class="page-header">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 31C10 18 21 25 24 16C26 11 28 9.5 32 8.5" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round"/><circle cx="8" cy="31" r="3.2" fill="currentColor"/><circle cx="32" cy="8.5" r="5.2" fill="currentColor"/></svg>DRIVELOG</div>
  <h1 id="page-title">달린 길을 간직해요</h1>
  <p class="intro" id="page-intro">사진을 더하거나, 지금 모습 그대로 저장해요.</p>
</header>
<canvas id="card" width="1080" height="1350" role="img" aria-label="드라이브 카드"></canvas>
<div class="actions" aria-label="카드 작업">
<a id="guide" class="action" hidden rel="noreferrer" target="_blank">목적지로 길 안내</a>
<button id="share" type="button" hidden>친구에게 코스 보내기</button>
<button id="photo" type="button" class="secondary" hidden>사진 넣기</button>
<input id="photo-file" type="file" accept="image/*" hidden>
<button id="save" type="button">이미지로 저장</button>
 </div>
<p class="status" id="status" role="status" aria-live="polite"></p>
<aside class="privacy" aria-labelledby="privacy-title">
<h2 class="privacy-title" id="privacy-title">내 경로는 휴대폰 안에</h2>
<p id="note">이 카드는 차량에서 보낸 QR 코드의 주소에서만 만들어져요. 경로는 이 휴대폰에서 그리고 어디로도 보내지 않아요. 지도를 그리려고 주행 지역의 지도 조각을 지도 서비스(OpenFreeMap)에서 받아요. 사진을 넣으면 이 휴대폰 안에서만 카드에 합쳐지고 올라가지 않아요.</p>
</aside>
</main>
<script>
"use strict";
// Everything comes from the part of the address after #, which the browser never sends to any server.
// The route is drawn here and never sent anywhere. The map under it is the one thing fetched: the map library
// (pinned, integrity-checked) and the map tiles of the drive's area from OpenFreeMap, as the car does when parked.
// No font is fetched and no referrer is sent.
const params = new URLSearchParams(location.hash.slice(1));
// A recommended course: ends trimmed in the car, a neighbourhood instead of the start, and no date or start time.
const course = params.get("t") === "c";
const canvas = document.getElementById("card");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
function announce(message) { status.textContent = message; }

function decodePolyline(text) {
  const points = [];
  let index = 0, lat = 0, lon = 0;
  while (index < text.length) {
    for (const axis of [0, 1]) {
      let shift = 0, result = 0, byte;
      do {
        byte = text.charCodeAt(index++) - 63;
        result |= (byte & 0x1f) << shift;
        shift += 5;
      } while (byte >= 0x20 && index < text.length);
      const delta = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (axis === 0) lat += delta; else lon += delta;
    }
    points.push([lat / 1e5, lon / 1e5]);
  }
  return points;
}

function haversineKm(a, b) {
  const r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 6371.0088 * 2 * Math.asin(Math.sqrt(Math.min(1, h)));
}

function shortName(name) {
  const trimmed = name.replace(/(해수욕장|해변|광역시|특별자치시|특별자치도|특별시)$/, "").trim();
  return trimmed || name;
}

// As in the car: under a minute is said so, never "0분".
function minutesText(seconds) {
  const m = Math.floor(seconds / 60);
  if (m < 1) return "1분 미만";
  return m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간 ${m % 60}분`;
}

function showError(message) {
  document.querySelector(".actions").remove();
  document.querySelector(".privacy").remove();
  canvas.remove();
  document.getElementById("page-title").textContent = "카드를 다시 받아 주세요";
  document.getElementById("page-intro").hidden = true;
  const p = document.createElement("p");
  p.className = "error";
  p.setAttribute("role", "alert");
  p.textContent = message;
  document.querySelector("main").appendChild(p);
}

const font = (weight, size) => `${weight} ${size}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif`;

// The look, after benchmarking share cards (Nike Run Club, Strava, Garmin, map posters, postcards): one hero number,
// the route on open space instead of a box, three shades of white only, and the brand small in a corner. What is ours
// is the stamp: a drive that ends at a stamp place gets a postage stamp pressed on it, as in the car.
const INK = "#ffffff", BG = "#131417", MUTED = "#b4b6ba", FAINT = "rgba(255,255,255,0.4)";

function drawBackground(W, H) {
  const fade = ctx.createLinearGradient(0, 0, 0, H);
  fade.addColorStop(0, BG); fade.addColorStop(1, "#0b0c0e");
  ctx.fillStyle = fade; ctx.fillRect(0, 0, W, H);
  // A soft light under the route, so the line reads as lit rather than printed on flat black.
  const glow = ctx.createRadialGradient(W / 2, 580, 0, W / 2, 580, 560);
  glow.addColorStop(0, "rgba(255,255,255,0.06)"); glow.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
}

// A dot grid that thins out towards the edges: plainly not a map, and no box around the drive.
function drawDots(box) {
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2, reach = Math.hypot(box.w, box.h) / 2;
  for (let y = box.y + 20; y < box.y + box.h; y += 40) for (let x = box.x + 20; x < box.x + box.w; x += 40) {
    const a = 0.14 * Math.max(0, 1 - Math.hypot(x - cx, y - cy) / reach);
    if (a < 0.01) continue;
    ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
  }
}

// The line between the route and the figures, cut like the tear line of a ticket stub.
function drawTearLine(W, y) {
  ctx.save();
  ctx.setLineDash([2, 14]); ctx.lineCap = "round"; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,0.28)";
  ctx.beginPath(); ctx.moveTo(48, y); ctx.lineTo(W - 48, y); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = BG;
  for (const x of [0, W]) { ctx.beginPath(); ctx.arc(x, y, 24, 0, Math.PI * 2); ctx.fill(); }
}

function wave(x0, x1, y, amplitude, period, phase) {
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 3) {
    const at = y + Math.sin((x + phase) / period) * amplitude;
    if (x === x0) ctx.moveTo(x, at); else ctx.lineTo(x, at);
  }
  ctx.stroke();
}

// A postage stamp: perforated paper, the sea every Busan stamp place sits by, and the place name, at the place's own
// tilt as in the car. A stamp still to be collected (a course) is the faded dotted outline the car uses for it.
function drawStamp(cx, cy, name, tilt, collected) {
  const w = 208, h = 244, r = 9;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(tilt * Math.PI / 180);
  if (collected) {
    ctx.fillStyle = INK; ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.fillStyle = BG;
    const across = 8, down = 9;
    for (let i = 0; i <= across; i++) for (const y of [-h / 2, h / 2]) {
      ctx.beginPath(); ctx.arc(-w / 2 + i * w / across, y, r, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i <= down; i++) for (const x of [-w / 2, w / 2]) {
      ctx.beginPath(); ctx.arc(x, -h / 2 + i * h / down, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillRect(-w / 2 + 18, -h / 2 + 18, w - 36, h - 36);
  } else {
    ctx.setLineDash([6, 10]); ctx.lineWidth = 3; ctx.strokeStyle = FAINT;
    ctx.strokeRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16); ctx.setLineDash([]);
  }
  const ink = collected ? INK : FAINT;
  ctx.textAlign = "center"; ctx.fillStyle = collected ? MUTED : FAINT; ctx.font = font(700, 20);
  ctx.fillText(collected ? "부산 스탬프" : "받을 수 있는 스탬프", 0, -h / 2 + 62, w - 44);
  ctx.strokeStyle = ink; ctx.lineWidth = 4; ctx.lineCap = "round";
  for (let row = 0; row < 3; row++) wave(-62, 62, -14 + row * 18, 5, 11, row * 14);
  ctx.fillStyle = ink; ctx.font = font(800, 36);
  ctx.fillText(shortName(name), 0, h / 2 - 42, w - 52);
  ctx.restore();
  if (collected) {
    // The postmark's cancel lines, running off the stamp's left edge.
    ctx.save(); ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 3; ctx.lineCap = "round";
    for (let row = 0; row < 3; row++) wave(cx - 200, cx - 40, cy + 26 + row * 20, 6, 13, 0);
    ctx.restore();
  }
  ctx.textAlign = "start";
}

function drawPill(text, right, top) {
  ctx.font = font(700, 24);
  const w = ctx.measureText(text).width + 36;
  ctx.strokeStyle = FAINT; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(right - w, top, w, 46, 23); ctx.stroke();
  ctx.fillStyle = MUTED; ctx.textBaseline = "middle"; ctx.fillText(text, right - w + 18, top + 24);
  ctx.textBaseline = "alphabetic";
}

// Required by the map data's licences; kept small in the map's own corner, as in the car.
const MAP_CREDIT = "© OpenMapTiles © OpenStreetMap";
const MAP_INSET = 60;
// Pinned and checked, so a changed copy of the map library never runs on a page that holds someone's drive.
const MAPLIBRE = {
  src: "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js",
  integrity: "sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj",
};
let lastRoute = null;
// A photo chosen on this phone. It is drawn into the card here and never uploaded anywhere.
let photo = null;
let lastMap = null;

// The car's night map (RouteMapCache.kt DARK_MAP_LAYERS): land, green and sea, then roads brightening with
// importance. No labels, so no fonts or icons are fetched; only the map tiles themselves.
function mapStyle() {
  const road = (id, classes, color, narrow, wide) => ({
    id, type: "line", source: "openmaptiles", "source-layer": "transportation", filter: ["in", "class", ...classes],
    layout: { "line-cap": "round", "line-join": "round" },
    // Zoomed out over a long drive the whole road network shows; it fades, so the route stays the brightest line.
    paint: {
      "line-color": color, "line-width": ["interpolate", ["exponential", 1.5], ["zoom"], 10, narrow, 16, wide],
      "line-opacity": ["interpolate", ["linear"], ["zoom"], 6, 0.35, 10, 0.75, 12, 1],
    },
  });
  return {
    version: 8,
    sources: { openmaptiles: { type: "vector", url: "https://tiles.openfreemap.org/planet" } },
    layers: [
      { id: "land", type: "background", paint: { "background-color": "#1B1C1F" } },
      { id: "green", type: "fill", source: "openmaptiles", "source-layer": "landcover", filter: ["in", "class", "wood", "grass"], paint: { "fill-color": "#17181B" } },
      { id: "water", type: "fill", source: "openmaptiles", "source-layer": "water", filter: ["!=", "brunnel", "tunnel"], paint: { "fill-color": "#08090A" } },
      road("road-minor", ["minor", "service"], "#3A3C41", 0.35, 2.0),
      road("road-mid", ["secondary", "tertiary"], "#5E6168", 0.7, 4.5),
      road("road-major", ["primary", "trunk"], "#8F9198", 1.1, 7.0),
      road("road-motorway", ["motorway"], "#B4B6BC", 1.6, 8.0),
    ],
  };
}

function loadMapLibrary() {
  if (window.maplibregl) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = MAPLIBRE.src; script.integrity = MAPLIBRE.integrity;
    script.crossOrigin = "anonymous"; script.referrerPolicy = "no-referrer";
    script.onload = resolve; script.onerror = reject;
    document.head.appendChild(script);
  });
}

/**
 * The map under the route, drawn on this phone. Only the tiles of the area are requested from OpenFreeMap; the
 * route itself never leaves the page. Null when the map does not arrive in time, and the card stays as it is.
 */
async function loadMap(box, all) {
  await loadMapLibrary();
  const ratio = 2;
  const holder = document.createElement("div");
  holder.setAttribute("aria-hidden", "true");
  holder.style.cssText = `position:fixed;left:-10000px;top:0;width:${box.w / ratio}px;height:${box.h / ratio}px`;
  document.body.appendChild(holder);
  const lats = all.map(p => p[0]), lons = all.map(p => p[1]);
  const map = new maplibregl.Map({
    container: holder, style: mapStyle(), interactive: false, attributionControl: false, preserveDrawingBuffer: true,
    pixelRatio: ratio, fadeDuration: 0,
    bounds: [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
    fitBoundsOptions: { padding: MAP_INSET / ratio, maxZoom: 16 },
  });
  const ready = await new Promise(resolve => {
    const timer = setTimeout(() => resolve(false), 12000);
    map.once("idle", () => { clearTimeout(timer); resolve(true); });
  });
  if (!ready) { map.remove(); holder.remove(); return null; }
  const image = document.createElement("canvas");
  image.width = box.w; image.height = box.h;
  image.getContext("2d").drawImage(map.getCanvas(), 0, 0, box.w, box.h);
  // map.project answers in CSS pixels of the holder; the image is ratio times that.
  const project = p => { const q = map.project([p[1], p[0]]); return [box.x + q.x * ratio, box.y + q.y * ratio]; };
  return { image, project, zoom: map.getZoom() };
}

// The navigation arrow the mockups put where the car is: a white disc with a dark arrowhead pointing the way it went.
function drawArrival(at, from) {
  const angle = Math.atan2(at[1] - from[1], at[0] - from[0]);
  ctx.save();
  ctx.translate(...at);
  ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 16;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.rotate(angle + Math.PI / 2);
  ctx.fillStyle = BG; ctx.beginPath();
  ctx.moveTo(0, -13); ctx.lineTo(10, 10.5); ctx.lineTo(0, 5); ctx.lineTo(-10, 10.5); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** Where the route goes: [x, y] on the card for [lat, lon]. Fitted to the box when there is no map to follow. */
function fitProjection(all, box) {
  const k = Math.cos(all.reduce((s, p) => s + p[0], 0) / all.length * Math.PI / 180);
  const xs = all.map(p => p[1] * k), ys = all.map(p => -p[0]);
  const minX = Math.min(...xs), minY = Math.min(...ys);
  const spanX = Math.max(Math.max(...xs) - minX, 1e-6), spanY = Math.max(Math.max(...ys) - minY, 1e-6);
  const scale = Math.min((box.w - MAP_INSET * 2) / spanX, (box.h - MAP_INSET * 2) / spanY);
  const ox = box.x + (box.w - spanX * scale) / 2, oy = box.y + (box.h - spanY * scale) / 2;
  return p => [ox + (p[1] * k - minX) * scale, oy + (-p[0] - minY) * scale];
}

// As the mockups draw it: one clean white line over the dark map, no glow and no marks along it, a small start
// and the arrow where the drive ended. One colour, whatever the speed.
function drawRouteArea(box, pieces, destination, map) {
  const all = pieces.flat().concat(destination ? [destination] : []);
  // With a photo, the photo takes the map's place: the route is fitted over it as the same single white line, and a
  // shade keeps the line readable. A photo is not a map, so the line is not placed on any geography.
  if (photo) {
    const scale = Math.max(box.w / photo.width, box.h / photo.height);
    const w = photo.width * scale, h = photo.height * scale;
    ctx.save();
    ctx.beginPath(); ctx.roundRect(box.x, box.y, box.w, box.h, 28); ctx.clip();
    ctx.drawImage(photo, box.x + (box.w - w) / 2, box.y + (box.h - h) / 2, w, h);
    ctx.fillStyle = "rgba(0,0,0,0.38)"; ctx.fillRect(box.x, box.y, box.w, box.h);
    ctx.restore();
    map = null;
  } else if (map) {
    ctx.save();
    ctx.beginPath(); ctx.roundRect(box.x, box.y, box.w, box.h, 28); ctx.clip();
    ctx.drawImage(map.image, box.x, box.y, box.w, box.h);
    ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(box.x, box.y, box.w, box.h, 28); ctx.stroke();
  } else if (!photo) drawDots(box);
  if (all.length < 2) return;
  const at = map ? map.project : fitProjection(all, box);
  ctx.save();
  ctx.beginPath(); ctx.roundRect(box.x, box.y, box.w, box.h, 28); ctx.clip();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  // A recording gap is not driving: it is drawn dotted, never as a solid road.
  ctx.setLineDash([2, 14]); ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255,255,255,0.6)";
  for (let i = 1; i < pieces.length; i++) {
    ctx.beginPath(); ctx.moveTo(...at(pieces[i - 1][pieces[i - 1].length - 1])); ctx.lineTo(...at(pieces[i][0])); ctx.stroke();
  }
  ctx.setLineDash([]);
  // A fine line, as in the car: thinner still over a zoomed-out map, where it would bury the coast road it follows.
  const routeWidth = map && map.zoom < 10 ? 4.5 : 6;
  const trace = () => { for (const piece of pieces) {
    ctx.beginPath();
    piece.forEach((p, i) => i === 0 ? ctx.moveTo(...at(p)) : ctx.lineTo(...at(p)));
    ctx.stroke();
  } };
  // Over a real map a faint dark casing keeps the thin white line apart from the white roads under it.
  if (map) { ctx.lineWidth = routeWidth * 2.6; ctx.strokeStyle = "rgba(0,0,0,0.4)"; trace(); }
  ctx.lineWidth = routeWidth; ctx.strokeStyle = INK; trace();
  const line = pieces.flat();
  if (line.length >= 2) {
    const start = at(line[0]), end = at(line[line.length - 1]);
    ctx.fillStyle = BG; ctx.beginPath(); ctx.arc(...start, 12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(...start, 10, 0, Math.PI * 2); ctx.stroke();
    if (destination) {
      // The place itself: the trimmed line stops short of it, so the last stretch is left dotted.
      const pin = at(destination);
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(...end, 8, 0, Math.PI * 2); ctx.fill();
      ctx.setLineDash([2, 14]); ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255,255,255,0.6)";
      ctx.beginPath(); ctx.moveTo(...end); ctx.lineTo(...pin); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(pin[0], pin[1] - 36, 28, Math.PI * 0.85, Math.PI * 2.15);
      ctx.lineTo(pin[0], pin[1]); ctx.closePath(); ctx.fill();
      ctx.fillStyle = BG; ctx.beginPath(); ctx.arc(pin[0], pin[1] - 36, 11, 0, Math.PI * 2); ctx.fill();
    } else {
      // The heading comes from a point a little way back, so a last jittery fix does not turn the arrow.
      let from = start;
      for (let i = line.length - 2; i >= 0; i--) {
        const p = at(line[i]);
        if (Math.hypot(p[0] - end[0], p[1] - end[1]) >= 24) { from = p; break; }
      }
      drawArrival(end, from);
    }
  }
  ctx.restore();
}

/** True when the drive is taller than it is wide on the map (Web Mercator, as the map tiles are drawn). */
function runsNorthSouth(all) {
  if (all.length < 2) return false;
  const y = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
  const ys = all.map(p => y(p[0])), xs = all.map(p => p[1] * Math.PI / 180);
  return Math.max(...ys) - Math.min(...ys) > (Math.max(...xs) - Math.min(...xs)) * 0.95;
}

// Where the map ends and the figures sit. The figure keeps its unit at 0.4 of its size and its label beneath it.
function layoutFor(all) {
  return runsNorthSouth(all)
    ? { mapBottom: 1040, tear: 1068, figure: 156, figureY: 1214, labelY: 1251, footerY: 1292, creditY: 1328 }
    : { mapBottom: 910, tear: 950, figure: 210, figureY: 1150, labelY: 1198, footerY: 1262, creditY: 1314 };
}

function draw(map) {
  if (params.get("v") !== "1") { showError("드라이브 카드 정보가 없어요. 차량의 QR 코드를 다시 찍어 주세요."); return false; }
  const name = params.get("n") || "드라이브";
  const started = new Date(Number(params.get("s") || 0) * 1000);
  const km = params.get("k");
  const seconds = Number(params.get("e") || 0);
  const simulated = params.get("m") === "1";
  const stamp = params.get("st");
  const pieces = (params.get("p") || "").split(".").filter(Boolean).map(decodePolyline).filter(p => p.length >= 2);
  const destination = course && params.get("dl") && params.get("dn") ? [Number(params.get("dl")), Number(params.get("dn"))] : null;
  const W = canvas.width, H = canvas.height, pad = 72;

  drawBackground(W, H);

  // Title. The stamp or the simulation mark takes the top right, so the title keeps clear of it.
  const corner = stamp ? 250 : simulated ? 200 : 0;
  ctx.fillStyle = MUTED; ctx.font = font(700, 28);
  ctx.fillText(course ? "추천 코스" : "나의 드라이브", pad, 116);
  ctx.fillStyle = INK; ctx.font = font(800, 66);
  ctx.fillText(course ? `${shortName(name)}까지 가는 길` : `${shortName(name)}에 남긴 하루`, pad, 196, W - pad * 2 - corner);

  // The route, over the map once it has arrived and over the dot grid until then (or if it never does).
  // The destination is fitted too, so a trimmed course and where it leads both show. The top right is left to the stamp.
  // A drive that runs north–south gets a taller map and a more compact figure below it, so the route is not a
  // thin strip down the middle of a wide map.
  const L = layoutFor(pieces.flat().concat(destination ? [destination] : []));
  const top = stamp ? 300 : 250;
  const box = { x: pad, y: top, w: W - pad * 2, h: L.mapBottom - top };
  drawRouteArea(box, pieces, destination, map);
  lastRoute = { box, all: pieces.flat().concat(destination ? [destination] : []) };
  if (stamp) drawStamp(W - pad - 104, 160, stamp, Number(params.get("sr") || -4), !course);
  else if (simulated) drawPill("시뮬레이션", W - pad, 82);

  drawTearLine(W, L.tear);

  // The figure, its unit at 0.4 of its size and its label beneath it.
  const value = km ?? "—";
  ctx.fillStyle = INK; ctx.font = font(800, L.figure);
  ctx.fillText(value, pad - 8, L.figureY);
  if (km) {
    const w = ctx.measureText(value).width;
    ctx.font = font(800, L.figure * 0.4); ctx.fillStyle = MUTED; ctx.fillText("km", pad - 8 + w + 18, L.figureY);
  }
  const label = course ? "코스 거리 · 앞뒤 500m 제외" : params.get("d") === "v" ? "차량 주행거리" : "추정 거리";
  // Measured in the car from the energy used; the car never sends it for a simulated drive.
  const ef = params.get("ef"), eu = params.get("eu");
  const efficiency = !course && !simulated && /^\d+(\.\d)?$/.test(ef || "") && (eu === "km/kWh" || eu === "km/L")
    ? `${eu === "km/kWh" ? "전비" : "연비"} ${ef} ${eu}` : null;
  ctx.fillStyle = MUTED; ctx.font = font(500, 28);
  ctx.fillText([label, efficiency, simulated ? "시뮬레이션" : null].filter(Boolean).join(" · "), pad, L.labelY);

  // The same footer as the cards in the car: place · time · date. A course has no date, only where it sets out from.
  const date = `${started.getFullYear()}.${String(started.getMonth() + 1).padStart(2, "0")}.${String(started.getDate()).padStart(2, "0")}`;
  const parts = course
    ? [`${params.get("a") || "출발지 주변"} 출발`, `약 ${minutesText(seconds)}`]
    : [shortName(name), minutesText(seconds), date];
  ctx.font = font(500, 30);
  let x = pad;
  const right = W - pad - 220;
  parts.forEach((part, i) => {
    if (i > 0) { ctx.fillStyle = FAINT; ctx.fillText(" · ", x, L.footerY); x += ctx.measureText(" · ").width; }
    ctx.fillStyle = INK; ctx.fillText(part, x, L.footerY, Math.max(40, right - x)); x += Math.min(ctx.measureText(part).width, Math.max(40, right - x));
  });
  ctx.textAlign = "end"; ctx.font = font(800, 36); ctx.fillStyle = INK;
  ctx.fillText("DRIVELOG", W - pad, L.footerY);
  ctx.textAlign = "start";
  // The map's credit cannot be left off. It goes under the card, not over the map, as in the car.
  if (map && !photo) {
    ctx.save();
    ctx.font = font(500, 18); ctx.textAlign = "right"; ctx.textBaseline = "bottom"; ctx.fillStyle = FAINT;
    ctx.fillText(MAP_CREDIT, box.x + box.w - 14, box.y + box.h - 10);
    ctx.restore();
  }
  return true;
}

const drawn = draw(null);
if (drawn) {
  canvas.setAttribute("aria-label", `${course ? "추천 코스" : "드라이브 카드"}: ${params.get("n") || "드라이브"}, ${params.get("k") || "거리 정보 없음"}${params.has("k") ? " km" : ""}, ${minutesText(Number(params.get("e") || 0))}${params.get("m") === "1" ? ", 시뮬레이션" : ""}`);
}
// The card shows at once on its dot grid, then again over the map when the map has arrived.
if (drawn && lastRoute && lastRoute.all.length >= 2) {
  loadMap(lastRoute.box, lastRoute.all).then(map => { if (map) { lastMap = map; draw(map); } }).catch(() => {});
}

if (drawn && course) {
  const name = params.get("n") || "목적지";
  document.title = `DRIVELOG 추천 코스 · ${shortName(name)}`;
  document.getElementById("page-title").textContent = "다음 드라이브로 떠나봐요";
  document.getElementById("page-intro").textContent = "코스를 친구에게 보내거나 목적지로 길 안내를 열어요.";
  document.getElementById("privacy-title").textContent = "코스에 담긴 정보";
  document.getElementById("save").classList.add("secondary");
  document.getElementById("note").textContent =
    "출발과 도착 주변 500m를 뺀 경로예요. 지도 조각은 OpenFreeMap에서 받고, 길 안내를 누르면 목적지 이름과 위치만 카카오맵으로 전달돼요.";
  const dl = params.get("dl"), dn = params.get("dn");
  if (dl && dn) {
    const guide = document.getElementById("guide");
    // Only the place goes to the map service, and only when the reader asks for directions.
    guide.href = `https://map.kakao.com/link/to/${encodeURIComponent(name)},${encodeURIComponent(dl)},${encodeURIComponent(dn)}`;
    guide.hidden = false;
  }
  const share = document.getElementById("share");
  share.hidden = false;
  share.classList.add("secondary");
  share.addEventListener("click", async () => {
    const data = { title: `${shortName(name)}까지 가는 길`, text: "DRIVELOG에서 추천한 드라이브 코스예요", url: location.href };
    if (navigator.share) {
      try { await navigator.share(data); return; } catch (error) { if (error.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(location.href); announce("코스 링크를 복사했어요. 친구에게 보내 주세요."); }
    catch { announce("주소창의 링크를 복사해 보내 주세요."); }
  });
}

// A passenger's photo, put into the card on this phone. Drawing it through the canvas leaves its location data
// behind, and the saved card is a new image. Only drive cards take a photo; a course card stays a route to follow.
if (drawn && !course) {
  const button = document.getElementById("photo");
  const input = document.getElementById("photo-file");
  button.hidden = false;
  button.addEventListener("click", () => {
    if (photo) { photo.close(); photo = null; button.textContent = "사진 넣기"; draw(lastMap); announce("사진을 뺐어요. 경로 카드로 저장할 수 있어요."); return; }
    input.value = ""; input.click();
  });
  input.addEventListener("change", async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      photo = await createImageBitmap(file, { imageOrientation: "from-image" });
      button.textContent = "사진 빼기";
      draw(lastMap);
      announce("사진을 넣었어요. 이미지로 저장하면 사진도 함께 담겨요.");
    } catch { announce("사진을 열 수 없어요. 다른 사진을 골라 주세요."); }
  });
}

// A drive card whose start was cut in the car says so. Older links carry the whole route and say nothing.
if (drawn && !course && /^\d+$/.test(params.get("ts") || "")) {
  document.getElementById("note").textContent =
    `출발 주변 ${params.get("ts")}m를 뺀 경로예요. 이 카드는 차량에서 보낸 QR 코드의 주소에서만 만들어지고, 경로는 이 휴대폰에서 그려 어디로도 보내지 않아요. 지도를 그리려고 주행 지역의 지도 조각을 지도 서비스(OpenFreeMap)에서 받아요. 사진을 넣으면 이 휴대폰 안에서만 카드에 합쳐지고 올라가지 않아요.`;
}

if (canvas.isConnected) {
  document.getElementById("save").addEventListener("click", () => {
    const save = document.getElementById("save");
    save.disabled = true;
    save.setAttribute("aria-busy", "true");
    announce("저장할 이미지를 준비하고 있어요.");
    canvas.toBlob(async blob => {
      try {
      if (!blob) { announce("이미지를 만들지 못했어요. 다시 저장해 주세요."); return; }
      const file = new File([blob], "drive-card.png", { type: "image/png" });
      // The phone's own share sheet where there is one, so the card can go straight to photos or a message.
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); announce("공유 창에서 선택한 곳으로 카드를 보냈어요."); return; } catch (error) { if (error.name === "AbortError") { announce("저장을 취소했어요. 다시 저장할 수 있어요."); return; } }
      }
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "drive-card.png";
      link.click();
      announce("이미지 다운로드를 시작했어요. 브라우저의 다운로드에서 확인해 주세요.");
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
      } catch { announce("이미지를 저장하지 못했어요. 다시 저장해 주세요."); }
      finally { save.disabled = false; save.removeAttribute("aria-busy"); }
    }, "image/png");
  });
}
</script>
</body>
</html>
