name: drivelog-local

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: drivelog
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME before starting PostgreSQL}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a non-empty DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
