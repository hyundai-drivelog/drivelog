# Zero-install profile for demos: file-backed H2 instead of PostgreSQL. Not for production data.
spring:
  datasource:
    url: jdbc:h2:file:${DRIVELOG_DATA_DIR:./data}/drivelog-demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS drivelog
    username: sa
    password: ""
